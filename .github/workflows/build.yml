name: Build KiroPet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Verify Windows, Tk and all three frame clocks
        run: node scripts/verify.js --tk
  build:
    needs: verify-wpf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('package.json'))['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package.json version'
          PY
      - name: Install development and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          npx playwright install --with-deps chromium
      - name: Build and verify, including actual browser and Linux Tk
        env:
          KIRO_TEST_PYTHON: python3
        run: xvfb-run -a npm run verify -- --browser --tk
      - name: Collect versioned package and checksum
        run: |
          package_file="kiro-whale-pet-$(node -p 'require("./package.json").version').vsix"
          mkdir -p dist
          cp "../$package_file" dist/
          cd dist
          sha256sum "$package_file" > SHA256SUMS
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiroPet-vsix
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KiroPet-vsix
          path: dist
      - name: Publish immutable versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/SHA256SUMS --verify-tag --title "KiroPet $GITHUB_REF_NAME" --generate-notes
