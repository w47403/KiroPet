name: Build KiroPet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/extension.js
          python -m py_compile scripts/WhalePet.py build_vsix.py
          bash -n scripts/HookSignal.sh
      - name: Build VSIX
        run: |
          python build_vsix.py
          mkdir -p dist
          mv ../kiro-whale-pet-*.vsix dist/
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiroPet-vsix
          path: dist/*.vsix
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.vsix --generate-notes --verify-tag
