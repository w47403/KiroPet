name: Build KiroPet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and render native Windows animation frames
        shell: powershell
        run: powershell.exe -NoProfile -STA -File test/verify-wpf.ps1
  build:
    needs: verify-wpf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/extension.js
          node --check src/animation-player.js
          node --test test/*.test.js
          python -m py_compile scripts/WhalePet.py scripts/animation_runtime.py scripts/dock_runtime.py scripts/status_signal.py build_vsix.py
          bash -n scripts/HookSignal.sh
      - name: Build VSIX
        run: |
          python build_vsix.py
          mkdir -p dist
          mv ../kiro-whale-pet-*.vsix dist/
      - name: Verify frame assets
        run: |
          python -m pip install Pillow==11.3.0
          cp dist/*.vsix ../
          python -m unittest discover -s test -p 'test_*.py'
      - name: Verify Windows PowerShell UTF-8 BOM in release package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          package = next(Path('dist').glob('*.vsix'))
          with ZipFile(package) as z:
              for name in ('extension/scripts/WhalePet.ps1', 'extension/scripts/HookSignal.ps1'):
                  assert z.read(name).startswith(b'\xef\xbb\xbf'), f'Missing UTF-8 BOM: {name}'
          print('Windows PowerShell encoding checks passed')
          PY
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiroPet-vsix
          path: dist/*.vsix
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p 'require("./package.json").version')"
          fi
          echo "Publishing release for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.vsix --clobber
          else
            gh release create "$TAG" dist/*.vsix --target "$GITHUB_SHA" --title "KiroPet $TAG" --generate-notes
          fi
